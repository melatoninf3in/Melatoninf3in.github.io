<!-- language: HTML, file: safepal-test.html, target: iOS deep-link debug -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>SafePal Deep Link Test</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;padding:24px 20px}
  h1{font-size:16px;font-weight:600;margin:0 0 6px;color:#fff}
  p{font-size:12.5px;color:#6b6b6b;margin:0 0 18px;line-height:1.5}
  button{width:100%;padding:12px 14px;border:1px solid #222;border-radius:6px;background:#e6e6e6;color:#000;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:8px}
  button:active{background:#fff}
  button.ghost{background:#111;color:#e6e6e6;border-color:#222}
  #log{margin-top:16px;padding:12px;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;color:#8a8a8a;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h1>SafePal Deep Link Test</h1>
  <p>Tap a button. Watch which one opens the SafePal app. Each fires a different scheme on a 1.5s delay so you can see which one lands.</p>

  <button id="testAll">TEST ALL SCHEMES</button>
  <button class="ghost" id="testSingle">safepal://browser</button>
  <button class="ghost" id="testOpen">safepal://openurl</button>
  <button class="ghost" id="testWeb">https://safepal.com/browser</button>
  <button class="ghost" id="testDapp">safepal://dapp</button>
  <button class="ghost" id="testWc">safepal://wc</button>

  <div id="log">ready. tap a button.</div>
</div>

<script>
var logEl = document.getElementById("log");
var PAGE = "https://moderio-sniper.vercel.app/";

function log(msg){
  var t = new Date().toISOString().substr(11,8);
  logEl.textContent += "\n[" + t + "] " + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

var SCHEMES = [
  { name: "safepal://browser?url=",    url: "safepal://browser?url=" + encodeURIComponent(PAGE) },
  { name: "safepal://openurl?url=",    url: "safepal://openurl?url=" + encodeURIComponent(PAGE) },
  { name: "safepal://dapp?url=",       url: "safepal://dapp?url=" + encodeURIComponent(PAGE) },
  { name: "safepal://wc?uri=",         url: "safepal://wc?uri=" + encodeURIComponent(PAGE) },
  { name: "https://safepal.com/browser?url=", url: "https://safepal.com/browser?url=" + encodeURIComponent(PAGE) },
  { name: "https://link.safepal.com/browser?url=", url: "https://link.safepal.com/browser?url=" + encodeURIComponent(PAGE) }
];

// wait for the page to be backgrounded (app opened) — if not, report failure
function watchHandoff(scheme, t0){
  setTimeout(function(){
    var elapsed = Date.now() - t0;
    if (document.hidden) {
      log("  ✓ " + scheme.name + " OPENED THE APP (page backgrounded)");
    } else {
      log("  ✗ " + scheme.name + " did nothing after " + elapsed + "ms");
    }
  }, 1500);
}

function tryScheme(scheme){
  log("trying " + scheme.name);
  log("  → " + scheme.url);
  var t0 = Date.now();
  try {
    window.location.href = scheme.url;
  } catch(e){
    log("  error: " + e.message);
  }
  watchHandoff(scheme, t0);
}

function testAll(){
  logEl.textContent = "=== TEST ALL ===";
  log("page: " + PAGE);
  log("user agent: " + navigator.userAgent);
  log("platform: " + (navigator.platform || "unknown"));

  var i = 0;
  function next(){
    if (i >= SCHEMES.length){
      log("=== done ===");
      return;
    }
    tryScheme(SCHEMES[i]);
    i++;
    setTimeout(next, 1800);
  }
  next();
}

document.getElementById("testAll").onclick = testAll;
document.getElementById("testSingle").onclick = function(){ tryScheme(SCHEMES[0]); };
document.getElementById("testOpen").onclick   = function(){ tryScheme(SCHEMES[1]); };
document.getElementById("testDapp").onclick   = function(){ tryScheme(SCHEMES[2]); };
document.getElementById("testWc").onclick     = function(){ tryScheme(SCHEMES[3]); };
document.getElementById("testWeb").onclick    = function(){ tryScheme(SCHEMES[4]); };
</script>
</body>
</html>
